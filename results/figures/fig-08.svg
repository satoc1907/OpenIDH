g class="mk" data-tip="random f1 · 画像+年齢 AUC 0.911"><rect class="diamond acc" x="525.1" y="206.6" width="8.8" height="8.8" transform="rotate(45 529.5 211.0)"/></g><text class="val" x="678" y="215.0">-0.006</text><text class="rowlab" x="136" y="245.0" text-anchor="end">random fold 2</text><line class="conn ind" x1="453.5" y1="241.0" x2="560.4" y2="241.0"/><g class="mk" data-tip="random f2 · 画像モデル AUC 0.900"><circle class="dot ood" cx="493.5" cy="241.0" r="5"/></g><g class="mk" data-tip="random f2 · 年齢のみ AUC 0.889"><circle class="dot ind" cx="453.5" cy="241.0" r="5"/></g><g class="mk" data-tip="random f2 · 画像+年齢 AUC 0.920"><rect class="diamond acc" x="556.0" y="236.6" width="8.8" height="8.8" transform="rotate(45 560.4 241.0)"/></g><text class="val" x="678" y="245.0">-0.012</text><text class="rowlab" x="136" y="275.0" text-anchor="end">random fold 3</text><line class="conn ind" x1="516.3" y1="271.0" x2="681.9" y2="271.0"/><g class="mk" data-tip="random f3 · 画像モデル AUC 0.907"><circle class="dot ood" cx="516.3" cy="271.0" r="5"/></g><g class="mk" data-tip="random f3 · 年齢のみ AUC 0.926"><circle class="dot ind" cx="582.0" cy="271.0" r="5"/></g><g class="mk" data-tip="random f3 · 画像+年齢 AUC 0.955"><rect class="diamond acc" x="677.5" y="266.6" width="8.8" height="8.8" transform="rotate(45 681.9 271.0)"/></g><text class="val" x="678" y="275.0">+0.019</text><text class="rowlab" x="136" y="305.0" text-anchor="end">random fold 4</text><line class="conn ind" x1="516.8" y1="301.0" x2="616.2" y2="301.0"/><g class="mk" data-tip="random f4 · 画像モデル AUC 0.907"><circle class="dot ood" cx="516.8" cy="301.0" r="5"/></g><g class="mk" data-tip="random f4 · 年齢のみ AUC 0.907"><circle class="dot ind" cx="518.0" cy="301.0" r="5"/></g><g class="mk" data-tip="random f4 · 画像+年齢 AUC 0.936"><rect class="diamond acc" x="611.8" y="296.6" width="8.8" height="8.8" transform="rotate(45 616.2 301.0)"/></g><text class="val" x="678" y="305.0">+0.000</text></svg>
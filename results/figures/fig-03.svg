.note{font-size:11.5px; fill:#7b8a92}
.dot.ood{fill:#eb6834}
.dot.ind{fill:#2a78d6}
.dot{stroke:#fbfcfc; stroke-width:2}
.dot.soft{opacity:.85}
.ring.ood{stroke:#eb6834}
.ring.ind{stroke:#2a78d6}
.ring{fill:#fbfcfc; stroke-width:2}

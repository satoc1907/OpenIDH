<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 536" width="520" height="536" role="img"><title>reliability diagram</title><style>svg{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;background:#fbfcfc} text{fill:#10161a}
.grid{stroke:#e2e7e9; stroke-width:1}
.sep{stroke:#dbe1e4; stroke-width:1; stroke-dasharray:3 3}
.tick{font-size:11px; fill:#7b8a92; font-variant-numeric:tabular-nums}
.pnl{font-size:12.5px; fill:#4d5b63; letter-spacing:.02em}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 557" width="760" height="557" role="img"><title>正答時 vs 誤答時の確信度（S）</title><style>svg{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;background:#fbfcfc} text{fill:#10161a}
.grid{stroke:#e2e7e9; stroke-width:1}
.sep{stroke:#dbe1e4; stroke-width:1; stroke-dasharray:3 3}
.tick{font-size:11px; fill:#7b8a92; font-variant-numeric:tabular-nums}
.pnl{font-size:12.5px; fill:#4d5b63; letter-spacing:.02em}
.rowlab{font-size:12.5px; fill:#10161a; font-family:inherit}
.runlab{font-size:10.5px; fill:#7b8a92}
.val{font-size:11.5px; fill:#4d5b63; font-variant-numeric:tabular-nums}
.val.sm{font-size:10.5px}
.note{font-size:11.5px; fill:#7b8a92}
.dot.ood{fill:#eb6834}
.dot.ind{fill:#2a78d6}
.dot{stroke:#fbfcfc; stroke-width:2}
.dot.soft{opacity:.85}
.ring.ood{stroke:#eb6834}
.ring.ind{stroke:#2a78d6}
.ring{fill:#fbfcfc; stroke-width:2}
.whisk.ood,.conn.ood{stroke:#eb6834}
.whisk.ind,.conn.ind{stroke:#2a78d6}
.whisk{stroke-width:2; opacity:.5}
.conn{stroke-width:2; opacity:.42}
.bar.ood{fill:#eb6834}
.bar.ind{fill:#2a78d6}
.dot.acc{fill:#1baf7a}
.ring.acc{stroke:#1baf7a}
.diamond{stroke:#fbfcfc; stroke-width:2}
.diamond.ood{fill:#eb6834}
.diamond.ind{fill:#2a78d6}
.rel{fill:none; stroke-width:2; opacity:.85}
.rel.ood{stroke:#eb6834}
.rel.ind{stroke:#2a78d6}
.rel.acc{stroke:#1baf7a}
.ideal{stroke:#7b8a92; stroke-width:1.5; stroke-dasharray:5 4}
.refline{stroke-width:1.5; stroke-dasharray:5 4; opacity:.75}
.refline.ood{stroke:#eb6834}
.refline.ind{stroke:#2a78d6}
.refline.muted{stroke:#7b8a92}
.refline.acc{stroke:#1baf7a; stroke-dasharray:none; stroke-width:2.5}
.dirlab.muted{fill:#7b8a92}
.band{opacity:.15; stroke:none}

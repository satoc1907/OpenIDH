.dirlab{font-size:11.5px; font-family:inherit}
.dirlab.ood{fill:#eb6834}
.dirlab.ind{fill:#2a78d6}
.dirlab.acc{fill:#1baf7a}
.unused{fill:rgba(16,22,26,.045)}
.hit{fill:transparent}
.mk{cursor:default}

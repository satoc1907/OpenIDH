.diamond.ood{fill:#eb6834}
.diamond.ind{fill:#2a78d6}
.rel{fill:none; stroke-width:2; opacity:.85}
.rel.ood{stroke:#eb6834}
.rel.ind{stroke:#2a78d6}
.rel.acc{stroke:#1baf7a}
.ideal{stroke:#7b8a92; stroke-width:1.5; stroke-dasharray:5 4}
.refline{stroke-width:1.5; stroke-dasharray:5 4; opacity:.75}
.refline.ood{stroke:#eb6834}
.refline.ind{stroke:#2a78d6}
.refline.muted{stroke:#7b8a92}

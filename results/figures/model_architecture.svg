art" >　 小さい腫瘍・セグメンテーション失敗で証拠を減らす</text><polyline points="580,590 655,590 655,410" fill="none" stroke="#8a8985" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="1020" y="560" font-size="11.5" fill="#0b0b0b" text-anchor="end" >学習：L = L(融合) + 0.4 × 平均 L(各分類器)</text><text x="1020" y="578" font-size="11" fill="#52514e" text-anchor="end" >各 L = Bayes リスク MSE + λ · KL(誤方向の証拠 ‖ 一様)</text><text x="1020" y="596" font-size="11" fill="#52514e" text-anchor="end" >modality dropout p = 0.2（系列単位）</text></svg>
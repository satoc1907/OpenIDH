# Model structure (spec §1.3, §4). Environment-independent.
model:
  backbone: vit_small_patch16_224.augreg_in21k
  pretrained_from_local: true      # read weights from paths.weights_dir (spec §1.4)
  embed_dim: 384
  share_single_trunk: true         # 4 single sequences share one 3ch trunk
  separate_heads: true             # per-sequence evidence heads (case B)
  expected_param_count: 44224396   # asserted in 00_setup_check / tests

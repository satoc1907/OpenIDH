[project]
name = "glioma-idh"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "nibabel>=5.4.2",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "papermill>=2.7.0",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "timm>=1.0.28",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

# ── OpenIDH model stack (Blackwell / CUDA 12.8) ──
# torch/torchvision are pulled from the PyTorch cu128 index (spec §1.1, §1.3).

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
